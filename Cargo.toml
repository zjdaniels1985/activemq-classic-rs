[package]
name = "activemq-classic-rs"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A Rust broker implementation targeting Apache ActiveMQ Classic compatibility"

[lib]
name = "activemq_classic_rs"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
base64 = "0.22.1"
bincode = "1"
chrono = "0.4.45"
flate2 = "1.1.10"
hex = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
sled = "0.34"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time", "io-util", "sync", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
